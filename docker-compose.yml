services:
  db:
    image: postgres:16-alpine
    container_name: primer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: primer
    ports:
      - "5432:5432"
    volumes:
      - primer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d primer"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  primer-pgdata:
